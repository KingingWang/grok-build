name: Release prebuilt binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$ ]]; then
            # Explicit release tag push or workflow_dispatch with tag.
            commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
            version="${tag#v}"
            test -f Cargo.lock

            manifest_version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/codegen/xai-grok-pager-bin/Cargo.toml", "rb"))["package"]["version"])')"

            if [[ "$version" != "$manifest_version" ]]; then
              echo "Tag version $version does not match package version $manifest_version" >&2
              exit 1
            fi
          else
            # Branch push (e.g. main) — generate a rolling release tag.
            commit="$GITHUB_SHA"
            manifest_version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/codegen/xai-grok-pager-bin/Cargo.toml", "rb"))["package"]["version"])')"
            short_sha="$(git rev-parse --short HEAD)"
            tag="v${manifest_version}-${short_sha}"
            version="${manifest_version}-${short_sha}"
          fi

          {
            echo "commit=$commit"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Validate the locked dependency graph
        run: cargo fetch --locked

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install the pinned Rust toolchain and target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      - name: Install protoc and musl toolchain on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler musl-tools
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
          protoc --version

          # Force musl-gcc as linker so the final binary is fully static.
          target_upper="$(echo "$TARGET" | tr 'a-z-' 'A-Z_')"
          echo "CARGO_TARGET_${target_upper}_LINKER=musl-gcc" >> "$GITHUB_ENV"

          # sqlite-vec expects BSD u_int*_t typedefs absent in musl headers.
          # Use target-specific CFLAGS (cc-rs only) so jemalloc's make is unaffected.
          target_lower="$(echo "$TARGET" | tr '-' '_')"
          echo "CFLAGS_${target_lower}=-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t" >> "$GITHUB_ENV"

          # jemalloc's configure misdetects C11 atomics on musl (especially aarch64).
          # Defining __STDC_NO_ATOMICS__ forces fallback to GCC __atomic builtins.
          echo "CFLAGS=-D__STDC_NO_ATOMICS__=1" >> "$GITHUB_ENV"


      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list protobuf >/dev/null 2>&1 || brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
          protoc --version

      - name: Build the distribution binary
        run: cargo build --locked --profile release-dist --target ${{ matrix.target }} -p xai-grok-pager-bin --features release-dist

      - name: Package and smoke-test the binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          source="target/${TARGET}/release-dist/xai-grok-pager"
          artifact="dist/grok-${VERSION}-${PLATFORM}"
          test -s "$source"
          mkdir -p dist
          cp "$source" "$artifact"
          chmod 755 "$artifact"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            strip --strip-unneeded "$artifact"
          else
            strip -x "$artifact"
          fi

          "$artifact" --version

      - name: Upload the prebuilt binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.platform }}
          path: dist/grok-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Download all prebuilt binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Validate release assets and create checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets

          expected=(
            "grok-${VERSION}-linux-aarch64"
            "grok-${VERSION}-linux-x86_64"
            "grok-${VERSION}-macos-aarch64"
            "grok-${VERSION}-macos-x86_64"
          )

          printf '%s\n' "${expected[@]}" | sort > /tmp/expected-assets
          find . -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/actual-assets
          diff --unified /tmp/expected-assets /tmp/actual-assets

          for asset in "${expected[@]}"; do
            test -s "$asset"
          done

          sha256sum "${expected[@]}" > SHA256SUMS

      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          cd release-assets

          # Ensure the tag exists (for rolling releases from branch pushes).
          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG" "$COMMIT"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$TAG" \
              --draft
            is_draft=true
          fi

          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            grok-* \
            SHA256SUMS

          if [[ "$is_draft" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
